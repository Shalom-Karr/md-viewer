name: Release Build

# Build md-viewer for each platform and attach the binaries to a GitHub Release
# whenever a v* tag is pushed (or run it by hand).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows only. This is a Windows application: it sets windows_subsystem,
  # requires the MSVC toolchain, and its docs assume Windows throughout.
  #
  # Linux is buildable but needs Cargo.toml changes, not just CI changes. The
  # eframe dependency uses default-features = false to drop the wgpu backend
  # (which halves cold build time), and that also drops the x11/wayland
  # features winit needs on Linux - without them the build fails with
  # "The platform you're compiling for is not supported by winit". Adding a
  # [target.'cfg(target_os = "linux")'.dependencies] block enabling
  # eframe's x11 and wayland features, plus libgtk-3-dev and libxkbcommon-dev
  # on the runner, is what it would take.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            binary: md-viewer.exe
            asset: md-viewer-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Stage artifact
        shell: bash
        run: cp target/release/${{ matrix.binary }} ${{ matrix.asset }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
